<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get a free quote | HD Laser Studio, Pacific Beach</title>
<meta name="description" content="Tell us your idea and get a free quote and digital proof for laser engraving, UV printing, laser cutting, awards, and bulk orders.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Figtree:wght@400;500;700;800&amp;display=swap">
<style>
:root{--bg:#F6F4EF;--ink:#15191E;--muted:#545B63;--red:#C8372A;--redd:#A32C21;--line:#E4E0D8;--field:#A9A196;--sel:#FBE9E6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,"Helvetica Neue",Helvetica,Arial,sans-serif}
a{color:var(--redd)}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 24px;border-bottom:1px solid var(--line);max-width:1200px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);font-family:"Bricolage Grotesque","Trebuchet MS",sans-serif;font-weight:800;letter-spacing:2px;font-size:17px}
.call{font-weight:700;color:var(--ink);text-decoration:none;white-space:nowrap}
main{max-width:1200px;margin:0 auto;padding:40px 24px 64px;display:grid;grid-template-columns:380px 1fr;gap:40px;align-items:start}
.side{background:var(--ink);color:#D5DADF;border-radius:24px;padding:32px;display:flex;flex-direction:column;gap:18px}
.side h1{font-family:"Bricolage Grotesque","Trebuchet MS",sans-serif;font-size:38px;line-height:1.08;color:#fff;margin:0}
.side ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
.side li{display:flex;gap:10px;line-height:1.45}
.side li::before{content:"";flex:none;width:18px;height:18px;margin-top:2px;border-radius:9px;background:#F2B63D}
form{background:#fff;border:1px solid var(--line);border-radius:24px;padding:32px;display:flex;flex-direction:column;gap:26px}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
legend{font-family:"Bricolage Grotesque","Trebuchet MS",sans-serif;font-size:24px;font-weight:700;margin-bottom:10px;padding:0}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opts label{position:relative}
.opts input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opts span{display:inline-flex;align-items:center;min-height:46px;padding:10px 18px;border:2px solid var(--line);border-radius:14px;font-weight:700;background:#fff}
.opts input:checked+span{border-color:var(--red);background:var(--sel)}
.opts input:focus-visible+span{outline:3px solid var(--red);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.f{display:flex;flex-direction:column;gap:6px}
.f label{font-weight:700}
.f small{color:var(--muted);font-weight:400}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],select,textarea{font:inherit;font-size:16px;padding:13px 14px;border:1px solid var(--field);border-radius:12px;background:#fff;color:var(--ink);width:100%}
.check{display:flex;gap:12px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.check input{width:22px;height:22px;accent-color:var(--red)}
button[type=submit]{align-self:flex-start;background:var(--red);color:#fff;border:0;border-radius:999px;padding:16px 30px;font:inherit;font-size:18px;font-weight:700;cursor:pointer;min-height:52px}
button[type=submit]:hover{background:var(--redd)}
.note{font-size:14px;color:var(--muted);margin:0}
.hp{position:absolute;left:-9999px}
@media (max-width:900px){main{grid-template-columns:1fr}.side h1{font-size:32px}}
@media (max-width:560px){.grid,.grid3{grid-template-columns:1fr}form,.side{padding:22px}header{padding:14px 18px}}
</style>
</head>
<body>
<header>
  <a class="brand" href="/" aria-label="HD Laser Studio home"><svg width="78" height="26" viewBox="220 115 1930 640" aria-hidden="true"><path fill="#C8372A" d="M510 125 L730 125 L636 371 L963 371 L1072 125 L2000 125 C2100 125 2160 210 2130 300 L2010 610 C1970 700 1880 742 1790 742 L1115 742 L1283 341 L1525 341 L1425 595 L1800 595 L1938 272 L1222 272 L1030 742 L808 742 L907 523 L572 523 L483 742 L232 742 Z"></path></svg><span>LASER STUDIO</span></a>
  <a class="call" href="tel:+18583739866">(858) 373-9866</a>
</header>
<main style="display:block;max-width:720px;text-align:left">
  <h1 style="font-family:'Bricolage Grotesque','Trebuchet MS',sans-serif;font-size:44px;line-height:1.08;margin:0 0 14px">Thanks. We&#8217;ve got your request.</h1>
  <p style="font-size:18px;line-height:1.55;color:#545B63">We&#8217;ll email you a price and a digital proof within 1&#8211;2 business days. If you have a logo or artwork file, just reply to our confirmation email and attach it.</p>
  <p style="display:flex;gap:12px;flex-wrap:wrap;margin-top:24px"><a href="/" style="background:#C8372A;color:#fff;text-decoration:none;font-weight:700;padding:14px 24px;border-radius:999px">Back to home</a><a href="/#work" style="border:2px solid #15191E;color:#15191E;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:999px">See our work</a></p>
</main>
</body>
</html>
