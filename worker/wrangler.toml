name = "hdlaser-checkout"
main = "src/index.js"
compatibility_date = "2026-01-01"

[triggers]
crons = ["0 * * * *"]          # hourly Square sync; Monday 15:00 UTC run also sends the digest

[[d1_databases]]
binding = "DB"
database_name = "hdlaser"
database_id = ""               # fill from the Cloudflare dashboard if deploying with wrangler

[vars]
SQUARE_ENV = "production"      # "sandbox" or "production"
SQUARE_LOCATION_ID = ""
SITE_URL = "https://hdlaser.net"
WORKER_URL = "https://hdlaser-checkout.yellow-smoke-9c0e.workers.dev"
ALLOWED_ORIGINS = "https://hdlaser.net,https://www.hdlaser.net"
DEPOSIT_PERCENT = "100"
SUPPORT_EMAIL = "contact@hdlaser.net"
FORMSPREE_ENDPOINT = "https://formspree.io/f/xaenoorj"
TAX_RATE = "0.0775"

# Secrets (never in this file): SQUARE_ACCESS_TOKEN, SQUARE_WEBHOOK_SIGNATURE_KEY, ADMIN_KEY
